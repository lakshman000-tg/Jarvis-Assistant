kind = "web"
previewPath = "/"
title = "JARVIS AI Assistant"
version = "1.0.0"
id = "artifacts/jarvis"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21662
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/jarvis run dev"

[services.env]
PORT = "21662"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/jarvis", "run", "build"]
publicDir = "artifacts/jarvis/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
